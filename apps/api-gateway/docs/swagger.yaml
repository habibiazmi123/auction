basePath: /
host: localhost:8080
info:
  contact:
    name: habibiazmi123
    url: https://github.com/habibiazmi123/auction
  description: |-
    Real-time auction platform — REST + WebSocket microservices.
    Auth via JWT Bearer token. WebSocket accepts `?access_token` query param.
  title: Auction Platform API
  version: 1.0.0
paths:
  /v1/auctions:
    post:
      consumes:
      - application/json
      description: Creates a new auction for a seller-owned product. Product is locked
        upon creation.
      parameters:
      - description: Auction payload
        in: body
        name: body
        required: true
        schema:
          properties:
            anti_sniping_extension_seconds:
              type: integer
            anti_sniping_window_seconds:
              type: integer
            ends_at:
              type: string
            minimum_increment_cents:
              type: integer
            product_id:
              type: string
            starting_price_cents:
              type: integer
            starts_at:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              anti_sniping_extension_seconds:
                type: integer
              anti_sniping_window_seconds:
                type: integer
              created_at:
                type: string
              current_price_cents:
                type: integer
              current_winner_id:
                type: string
              ends_at:
                type: string
              id:
                type: string
              minimum_increment_cents:
                type: integer
              product_description:
                type: string
              product_id:
                type: string
              product_name:
                type: string
              product_quantity:
                type: integer
              seller_id:
                type: string
              starting_price_cents:
                type: integer
              starts_at:
                type: string
              status:
                type: string
              updated_at:
                type: string
              version:
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create auction
      tags:
      - Auctions
  /v1/auctions/{auction_id}:
    get:
      description: Returns a single auction by ID.
      parameters:
      - description: Auction UUID
        in: path
        name: auction_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              anti_sniping_extension_seconds:
                type: integer
              anti_sniping_window_seconds:
                type: integer
              created_at:
                type: string
              current_price_cents:
                type: integer
              current_winner_id:
                type: string
              ends_at:
                type: string
              id:
                type: string
              minimum_increment_cents:
                type: integer
              product_description:
                type: string
              product_id:
                type: string
              product_name:
                type: string
              product_quantity:
                type: integer
              seller_id:
                type: string
              starting_price_cents:
                type: integer
              starts_at:
                type: string
              status:
                type: string
              updated_at:
                type: string
              version:
                type: integer
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get auction
      tags:
      - Auctions
  /v1/auctions/{auction_id}/bids:
    post:
      consumes:
      - application/json
      description: Publishes a bid command to Kafka (async). Buyer role required.
        Result delivered via WebSocket (`/v1/auctions/{auction_id}/live`). Idempotent
        via `Idempotency-Key` header.
      parameters:
      - description: Auction UUID
        in: path
        name: auction_id
        required: true
        type: string
      - description: Deduplication key
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Bid payload
        in: body
        name: body
        required: true
        schema:
          properties:
            amount_cents:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            properties:
              auction_id:
                type: string
              bid_id:
                type: string
              status:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Place bid
      tags:
      - Bids
  /v1/auctions/{auction_id}/live:
    get:
      description: 'Upgrades to WebSocket (subprotocol: `auction-live`). Streams real-time
        auction events from Kafka. Auth via `Authorization: Bearer` header or `?access_token`
        query param. Limits: max 1000/auction, max 10/user. Ping: 30s interval, 10s
        timeout.'
      parameters:
      - description: Auction UUID
        in: path
        name: auction_id
        required: true
        type: string
      - description: JWT (browser WebSocket fallback)
        in: query
        name: access_token
        type: string
      responses:
        "101":
          description: WebSocket upgrade
        "400":
          description: Bad Request
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: WebSocket — auction live
      tags:
      - WebSocket
  /v1/auctions/{auction_id}/settlement:
    get:
      description: Returns the settlement ledger entry for a closed auction.
      parameters:
      - description: Auction UUID
        in: path
        name: auction_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              amount_cents:
                type: integer
              auction_id:
                type: string
              bid_id:
                type: string
              buyer_id:
                type: string
              created_at:
                type: string
              id:
                type: string
              seller_id:
                type: string
              status:
                type: string
              updated_at:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get settlement
      tags:
      - Settlements
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user and returns JWT access token + opaque refresh
        token.
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          properties:
            email:
              type: string
            password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              access_expires_at:
                type: string
              access_token:
                type: string
              refresh_expires_at:
                type: string
              refresh_token:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      summary: Login
      tags:
      - Auth
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the refresh token — subsequent refresh attempts will fail.
      parameters:
      - description: Logout payload
        in: body
        name: body
        required: true
        schema:
          properties:
            refresh_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: Token revoked
        "400":
          description: Bad Request
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      summary: Logout
      tags:
      - Auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates the refresh token — returns new token pair, revokes old
        refresh token.
      parameters:
      - description: Refresh payload
        in: body
        name: body
        required: true
        schema:
          properties:
            refresh_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              access_expires_at:
                type: string
              access_token:
                type: string
              refresh_expires_at:
                type: string
              refresh_token:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      summary: Refresh token
      tags:
      - Auth
  /v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          properties:
            email:
              type: string
            password:
              type: string
            role:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              created_at:
                type: string
              email:
                type: string
              id:
                type: string
              role:
                type: string
              updated_at:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      summary: Register user
      tags:
      - Auth
  /v1/notifications:
    get:
      description: Returns all notifications for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              notifications:
                items:
                  properties:
                    auction_id:
                      type: string
                    body:
                      type: string
                    created_at:
                      type: string
                    id:
                      type: string
                    read:
                      type: boolean
                    title:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: List notifications
      tags:
      - Notifications
  /v1/notifications/live:
    get:
      description: 'Upgrades to WebSocket (subprotocol: `notification-live`). Streams
        real-time notification events from Kafka — filtered to authenticated user.
        Auth via `Authorization: Bearer` header or `?access_token` query param. Limits:
        max 10/user. Ping: 30s interval, 10s timeout.'
      parameters:
      - description: JWT (browser WebSocket fallback)
        in: query
        name: access_token
        type: string
      responses:
        "101":
          description: WebSocket upgrade
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: WebSocket — notification live
      tags:
      - WebSocket
  /v1/products:
    get:
      description: Returns paginated list of products.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page, max 100 (default: 20)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              items:
                items:
                  type: object
                type: array
              page:
                type: integer
              page_size:
                type: integer
              total:
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: List products
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: Creates a new product listing. Requires seller role.
      parameters:
      - description: Product payload
        in: body
        name: body
        required: true
        schema:
          properties:
            description:
              type: string
            name:
              type: string
            quantity:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              created_at:
                type: string
              description:
                type: string
              id:
                type: string
              name:
                type: string
              quantity:
                type: integer
              seller_id:
                type: string
              status:
                type: string
              updated_at:
                type: string
              version:
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create product
      tags:
      - Products
  /v1/products/{product_id}:
    get:
      description: Returns a single product by ID.
      parameters:
      - description: Product UUID
        in: path
        name: product_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              created_at:
                type: string
              description:
                type: string
              id:
                type: string
              name:
                type: string
              quantity:
                type: integer
              seller_id:
                type: string
              status:
                type: string
              updated_at:
                type: string
              version:
                type: integer
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get product
      tags:
      - Products
    patch:
      consumes:
      - application/json
      description: Updates a product. Seller must own the product. Returns 409 if
        product is locked by an active auction.
      parameters:
      - description: Product UUID
        in: path
        name: product_id
        required: true
        type: string
      - description: Product payload
        in: body
        name: body
        required: true
        schema:
          properties:
            description:
              type: string
            name:
              type: string
            quantity:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: Updated
        "400":
          description: Bad Request
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update product
      tags:
      - Products
    put:
      consumes:
      - application/json
      description: Updates a product. Seller must own the product. Returns 409 if
        product is locked by an active auction.
      parameters:
      - description: Product UUID
        in: path
        name: product_id
        required: true
        type: string
      - description: Product payload
        in: body
        name: body
        required: true
        schema:
          properties:
            description:
              type: string
            name:
              type: string
            quantity:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: Updated
        "400":
          description: Bad Request
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
        "409":
          description: Conflict
          schema:
            properties:
              code:
                type: string
              message:
                type: string
              request_id:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update product
      tags:
      - Products
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Liveness and readiness probes
  name: Health
- description: User registration, login, token refresh, and logout
  name: Auth
- description: Product CRUD (sellers only for mutations)
  name: Products
- description: Auction lifecycle — create and view
  name: Auctions
- description: Async bid placement (result via WebSocket)
  name: Bids
- description: Settlement ledger for closed auctions
  name: Settlements
- description: User notification list
  name: Notifications
- description: Real-time event streams
  name: WebSocket
